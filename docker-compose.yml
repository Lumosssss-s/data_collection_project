# 兴智杯 · 医疗检索分析平台
# 复制自法规项目（E:\传智杯\智能检索分析系统源代码），已完成运行时隔离：
# 项目名 / 容器名 / 端口 / 卷名 / 镜像名 全部独立，可与法规栈并存（同一时间建议只跑一套后端）

name: medical-rag-platform

services:
  elasticsearch:
    image: medical-rag-es:8.11.0
    build:
      context: .
      dockerfile: docker/Dockerfile.es
    container_name: medical-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9201:9200"
    volumes:
      - medical_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: medical-redis
    restart: always
    # 语义缓存专用：只放热问条目（百条级）。达到上限后的淘汰由后端 SemanticCache._trim 决定：
    # 候选=非 pinned 条目，按 hot 命中次数升序淘汰、同分按写入时间升序；pinned（预热）条目永不淘汰。
    # 这里的 maxmemory-policy=allkeys-lru 是 Redis 内存上限策略，只在 128MB 这种极端情况下才生效，
    # 与上述容量淘汰不是同一回事，不要按 LRU 理解条目淘汰顺序。
    # 持久化：问答条目的生成成本是真实 LLM 调用（30 条热问约 15~28 万 tokens），
    # 容器重建/机器重启后不能丢，故开 AOF（everysec）并挂 named volume。
    # 关闭 RDB 快照（--save ""）：语义缓存价值在条目本身，AOF 已足够，不必再刷快照。
    # 语料失效仍由后端按 doc_catalog 版本比对整库清空，持久化不会引入过期数据。
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - medical_redis_data:/data
    ports:
      # 宿主端口用 6380，避免与本机已有 Redis（6379）冲突
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    image: medical-rag-backend:latest
    build: { context: ., dockerfile: docker/Dockerfile }
    container_name: medical-backend
    mem_limit: 10g
    mem_reservation: 3g
    restart: always
    ports:
      - "8002:8001"
    environment:
      - MEDICAL_ES_HOSTS=["http://elasticsearch:9200"]
      - MEDICAL_ES_USER=elastic
      - MEDICAL_ES_PASSWORD=${MEDICAL_ES_PASSWORD}
      # 语义缓存（Redis）：连不上时后端自动降级到进程内精确缓存，不影响问答/检索
      - MEDICAL_REDIS_URL=${MEDICAL_REDIS_URL:-redis://redis:6379/0}
      - MEDICAL_SEMANTIC_CACHE_ENABLED=${MEDICAL_SEMANTIC_CACHE_ENABLED:-true}
      # 注：MEDICAL_SEMANTIC_CACHE_THRESHOLD 刻意不在此注入 —— 该阈值由
      # scripts/cache/calibrate_threshold.py 标定，只允许在 core/config.py 一处维护；
      # 在此注入环境变量会覆盖代码默认值，导致「改了 config.py 却不生效」的静默漂移。
      - MEDICAL_LLM_API_KEY=${MEDICAL_LLM_API_KEY}
      - MEDICAL_LLM_API_BASE_URL=https://api.deepseek.com/v1
      - MEDICAL_LLM_MODEL=deepseek-flash
      - MEDICAL_LLM_DEEPSEEK_API_KEY=${MEDICAL_DEEPSEEK_API_KEY}
      # RAG 编排链开关：true=走 LangChain 编排链，false=回退既有手写链路（迁移期一键回滚）
      - MEDICAL_RAG_CHAIN_ENABLED=${MEDICAL_RAG_CHAIN_ENABLED:-true}
      - MEDICAL_ADMIN_TOKEN=${MEDICAL_ADMIN_TOKEN:-dev_admin_token_change_me}
      - MEDICAL_EMBEDDING_MODEL=/models/bge-m3
      - MEDICAL_RERANKER_MODEL=/models/bge-reranker-v2-m3
      # CPU 推理性能参数（可按部署机器调整，无需改代码）
      - MEDICAL_TORCH_NUM_THREADS=${MEDICAL_TORCH_NUM_THREADS:-8}
      - MEDICAL_RERANKER_BATCH_SIZE=${MEDICAL_RERANKER_BATCH_SIZE:-8}
      # OpenMP 线程与自旋。这些变量由 OpenMP 运行时在「首次并行区」初始化时读取，
      # 必须在进程启动前注入：代码里 import torch 之后再 os.environ.setdefault 已无效。
      # PASSIVE + SPINCOUNT=0 让空闲线程睡眠而非空转，避免过度订阅时白烧 CPU。
      - OMP_NUM_THREADS=${MEDICAL_TORCH_NUM_THREADS:-8}
      - MKL_NUM_THREADS=${MEDICAL_TORCH_NUM_THREADS:-8}
      - OMP_WAIT_POLICY=PASSIVE
      - GOMP_SPINCOUNT=0
      # 两阶段精排窗口（只对 RRF 前 N 条跑 cross-encoder，其余按 RRF 顺序拼接）
      - MEDICAL_RERANKER_WINDOW=${MEDICAL_RERANKER_WINDOW:-20}
      # 实体消歧 L3 向量对齐（变体兜底，配合数字/编辑距离/长度三重守卫）
      - MEDICAL_ENTITY_ALIGN_ENABLED=${MEDICAL_ENTITY_ALIGN_ENABLED:-true}
      - MEDICAL_ENTITY_ALIGN_THRESHOLD=${MEDICAL_ENTITY_ALIGN_THRESHOLD:-0.95}
      # 批次内部两两比对：根治「同一批次首次共同出现的變体」被写成两条文档
      - MEDICAL_ENTITY_ALIGN_INTRA_BATCH=${MEDICAL_ENTITY_ALIGN_INTRA_BATCH:-true}
      - TOKENIZERS_PARALLELISM=false
    volumes:
      # 挂载本地 ML 模型（避免在容器内下载）
      # 模型目录由 .env 的 MEDICAL_MODELS_DIR 指定，默认项目内 ./models
      # 医疗副本：MEDICAL_MODELS_DIR 指向法规项目的 models 目录（只读共享，省 6.4GB）
      - ${MEDICAL_MODELS_DIR:-./models}/bge-m3:/models/bge-m3:ro
      - ${MEDICAL_MODELS_DIR:-./models}/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      # 挂载后端源码：改代码后重启容器即可生效，无需重建镜像
      - ./medical_rag:/app
      # 挂载医疗数据
      # data/raw 必须可写：管理端新增/修改/删除文档会写入该目录
      - ./medical_rag/data/raw:/app/data/raw:rw
      # data/clean（G3 14 目录）：清洗后数据；ingest 只读入库（BE-37）。
      # 2026-11-04 起改为 rw：patient_service 生成白话后需把 patient_plain
      # 原子写回 drug_labels/{drug_id}.json（ES 重灌会覆盖 ES 侧缓存，clean 才是持久源）。
      - ./medical_rag/data/clean:/app/data/clean:rw
      - ./medical_rag/data/doc_catalog.json:/app/data/doc_catalog.json
      - ./medical_rag/data/taxonomy_merged.json:/app/data/taxonomy_merged.json:ro
    # 就绪探针：打 /health/ready（模型加载完成后才 200，预热期间 503）。
    # 不用 /health：那个只要进程活着就返回 200，无法反映"能不能高效服务"。
    # 镜像基于 python:3.10-slim，没有 curl，故用 python 发起请求。
    # start_period 给足模型预热时间（bge-m3 冷加载实测约 60s），期间的失败不计入 retries。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              code = urllib.request.urlopen("http://127.0.0.1:8001/health/ready", timeout=4).status
          except Exception:
              code = 0
          sys.exit(0 if code == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: medical-frontend
    # 与 es/backend 保持一致：前端容器若意外退出（如 nginx 进程异常、宿主重启）
    # 自动拉起，避免竞赛期间页面静默不可访问。
    restart: always
    ports:
      - "3001:80"
      # H5 移动端预览（miniapp/dist，容器内 8080）：对外固定 3100，替代原 python h5_preview 进程
      - "3100:8080"
    environment:
      # H5 Basic Auth 凭据：由 /docker-entrypoint.d/40-h5-htpasswd.sh 在容器启动时生成 htpasswd
      # 密码不落任何配置文件；缺 MEDICAL_H5_AUTH_PASS 时容器启动失败（fail-closed）
      - MEDICAL_H5_AUTH_USER=${MEDICAL_H5_AUTH_USER:-h5}
      - MEDICAL_H5_AUTH_PASS=${MEDICAL_H5_AUTH_PASS}
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # H5 移动端站点（Taro build:h5 产物）与独立 server block（容器内 8080）
      - ./miniapp/dist:/usr/share/nginx/h5:ro
      - ./docker/h5.conf:/etc/nginx/conf.d/h5.conf:ro
      - ./docker/h5-htpasswd.sh:/docker-entrypoint.d/40-h5-htpasswd.sh:ro
    # 等后端"就绪"而非"启动"：否则前端容器会在后端模型仍在预热时就绪，
    # 用户此时打开页面发起的检索会排在模型加载后面长时间等待。
    depends_on:
      backend:
        condition: service_healthy

volumes:
  medical_es_data:
    name: medical_es_data
  # 语义缓存 AOF 落盘位置：固定 name，避免 `docker compose down` 清掉预热成果
  medical_redis_data:
    name: medical_redis_data