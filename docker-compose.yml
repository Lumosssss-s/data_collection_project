# 兴智杯 · 医疗检索分析平台
# 复制自法规项目（E:\传智杯\智能检索分析系统源代码），已完成运行时隔离：
# 项目名 / 容器名 / 端口 / 卷名 / 镜像名 全部独立，可与法规栈并存（同一时间建议只跑一套后端）

name: medical-rag-platform

services:
  elasticsearch:
    image: medical-rag-es:8.11.0
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: medical-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9201:9200"
    volumes:
      - medical_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: medical-rag-backend:latest
    build: .
    container_name: medical-backend
    mem_limit: 10g
    mem_reservation: 3g
    restart: always
    ports:
      - "8002:8001"
    environment:
      - MEDICAL_ES_HOSTS=["http://elasticsearch:9200"]
      - MEDICAL_ES_USER=elastic
      - MEDICAL_ES_PASSWORD=${MEDICAL_ES_PASSWORD}
      - MEDICAL_LLM_API_KEY=${MEDICAL_LLM_API_KEY}
      - MEDICAL_LLM_API_BASE_URL=https://api.deepseek.com/v1
      - MEDICAL_LLM_MODEL=deepseek-flash
      - MEDICAL_LLM_DEEPSEEK_API_KEY=${MEDICAL_DEEPSEEK_API_KEY}
      # RAG 编排链开关：true=走 LangChain 编排链，false=回退既有手写链路（迁移期一键回滚）
      - MEDICAL_RAG_CHAIN_ENABLED=${MEDICAL_RAG_CHAIN_ENABLED:-true}
      - MEDICAL_ADMIN_TOKEN=${MEDICAL_ADMIN_TOKEN:-dev_admin_token_change_me}
      - MEDICAL_EMBEDDING_MODEL=/models/bge-m3
      - MEDICAL_RERANKER_MODEL=/models/bge-reranker-v2-m3
      # CPU 推理性能参数（可按部署机器调整，无需改代码）
      - MEDICAL_TORCH_NUM_THREADS=${MEDICAL_TORCH_NUM_THREADS:-8}
      - MEDICAL_RERANKER_BATCH_SIZE=${MEDICAL_RERANKER_BATCH_SIZE:-8}
      # OpenMP 线程与自旋。这些变量由 OpenMP 运行时在「首次并行区」初始化时读取，
      # 必须在进程启动前注入：代码里 import torch 之后再 os.environ.setdefault 已无效。
      # PASSIVE + SPINCOUNT=0 让空闲线程睡眠而非空转，避免过度订阅时白烧 CPU。
      - OMP_NUM_THREADS=${MEDICAL_TORCH_NUM_THREADS:-8}
      - MKL_NUM_THREADS=${MEDICAL_TORCH_NUM_THREADS:-8}
      - OMP_WAIT_POLICY=PASSIVE
      - GOMP_SPINCOUNT=0
      # 两阶段精排窗口（只对 RRF 前 N 条跑 cross-encoder，其余按 RRF 顺序拼接）
      - MEDICAL_RERANKER_WINDOW=${MEDICAL_RERANKER_WINDOW:-20}
      # 实体消歧 L3 向量对齐（变体兜底，配合数字/编辑距离/长度三重守卫）
      - MEDICAL_ENTITY_ALIGN_ENABLED=${MEDICAL_ENTITY_ALIGN_ENABLED:-true}
      - MEDICAL_ENTITY_ALIGN_THRESHOLD=${MEDICAL_ENTITY_ALIGN_THRESHOLD:-0.95}
      # 批次内部两两比对：根治「同一批次首次共同出现的變体」被写成两条文档
      - MEDICAL_ENTITY_ALIGN_INTRA_BATCH=${MEDICAL_ENTITY_ALIGN_INTRA_BATCH:-true}
      - TOKENIZERS_PARALLELISM=false
    volumes:
      # 挂载本地 ML 模型（避免在容器内下载）
      # 模型目录由 .env 的 MEDICAL_MODELS_DIR 指定，默认项目内 ./models
      # 医疗副本：MEDICAL_MODELS_DIR 指向法规项目的 models 目录（只读共享，省 6.4GB）
      - ${MEDICAL_MODELS_DIR:-./models}/bge-m3:/models/bge-m3:ro
      - ${MEDICAL_MODELS_DIR:-./models}/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      # 挂载后端源码：改代码后重启容器即可生效，无需重建镜像
      - ./medical_rag:/app
      # 挂载医疗数据
      # data/raw 必须可写：管理端新增/修改/删除文档会写入该目录
      - ./medical_rag/data/raw:/app/data/raw:rw
      # data/clean（G3 14 目录）：清洗后数据，供 ingest.py 只读入库（BE-37）
      - ./medical_rag/data/clean:/app/data/clean:ro
      - ./medical_rag/data/doc_catalog.json:/app/data/doc_catalog.json
      - ./medical_rag/data/taxonomy_merged.json:/app/data/taxonomy_merged.json:ro
    # 就绪探针：打 /health/ready（模型加载完成后才 200，预热期间 503）。
    # 不用 /health：那个只要进程活着就返回 200，无法反映"能不能高效服务"。
    # 镜像基于 python:3.10-slim，没有 curl，故用 python 发起请求。
    # start_period 给足模型预热时间（bge-m3 冷加载实测约 60s），期间的失败不计入 retries。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              code = urllib.request.urlopen("http://127.0.0.1:8001/health/ready", timeout=4).status
          except Exception:
              code = 0
          sys.exit(0 if code == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: medical-frontend
    # 与 es/backend 保持一致：前端容器若意外退出（如 nginx 进程异常、宿主重启）
    # 自动拉起，避免竞赛期间页面静默不可访问。
    restart: always
    ports:
      - "3001:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 等后端"就绪"而非"启动"：否则前端容器会在后端模型仍在预热时就绪，
    # 用户此时打开页面发起的检索会排在模型加载后面长时间等待。
    depends_on:
      backend:
        condition: service_healthy

volumes:
  medical_es_data:
    name: medical_es_data