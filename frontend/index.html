    <!-- 配色双开关：
         ?palette=s1|s2|s3（缺省 s3，科技医疗）
         ?surface=w1|w2|w3（缺省 baseline 白底）
         删掉 palette.css + surface.css 即回落 tokens.css 基线。 -->
    <script>
        (function () {
            var palette = (location.search.match(/palette=(s[123])/) || [])[1] || 's3';
            var surface = (location.search.match(/surface=(w[123])/) || [])[1];  // 缺省不写 data-surface
            document.documentElement.setAttribute('data-palette', palette);
            if (surface) document.documentElement.setAttribute('data-surface', surface);
        })();
    </script>
    <script src="vendor/chart.umd.min.js?v=4.4.0"></script>
    <!-- Markdown 渲染结果消毒（纵深防御）；已本地 vendor 化，断网可用 -->
