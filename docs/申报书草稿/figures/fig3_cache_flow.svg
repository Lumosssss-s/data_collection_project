<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><text x="40" y="96" font-family="Microsoft YaHei" font-size="46" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">语义缓存判定：三层判定与降级路径</text><text x="40" y="154" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">阈值 0.95（2026-11-04 生效，取代原 0.88）；零误命中优先于命中率</text><rect x="160" y="216" width="420" height="104" rx="12" fill="#DFF1FB" stroke="#56B4E9" stroke-width="3"/><text x="184" y="250" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">查询规范化</text><text x="184" y="294" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">去噪/同义词归一</text><line x1="370.0" y1="320" x2="370.0" y2="344" stroke="#56B4E9" stroke-width="3"/><rect x="160" y="344" width="420" height="104" rx="12" fill="#DFF1FB" stroke="#56B4E9" stroke-width="3"/><text x="184" y="378" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">L0 精确键匹配</text><text x="184" y="422" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">逐字一致</text><line x1="370.0" y1="448" x2="370.0" y2="472" stroke="#56B4E9" stroke-width="3"/><rect x="160" y="472" width="420" height="104" rx="12" fill="#DFF1FB" stroke="#56B4E9" stroke-width="3"/><text x="184" y="506" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">L1 语义相似度</text><text x="184" y="550" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">余弦 ≥0.95</text><line x1="370.0" y1="576" x2="370.0" y2="600" stroke="#56B4E9" stroke-width="3"/><rect x="160" y="600" width="420" height="104" rx="12" fill="#DFF1FB" stroke="#56B4E9" stroke-width="3"/><text x="184" y="634" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">L2 槽位守卫</text><text x="184" y="678" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">槽位比对；拦截 1 例</text><line x1="580" y1="396" x2="780" y2="396" stroke="#56B4E9" stroke-width="3"/><rect x="780" y="360" width="640" height="72" rx="10" fill="#DFF1FB" stroke="#56B4E9" stroke-width="2"/><text x="804" y="396" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">命中 → 重放 419–711 ms</text><line x1="580" y1="524" x2="780" y2="524" stroke="#D55E00" stroke-width="3"/><rect x="780" y="488" width="640" height="72" rx="10" fill="#FBE7DB" stroke="#D55E00" stroke-width="2"/><text x="804" y="524" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">余弦 &lt; 0.95 → 进入生成</text><line x1="580" y1="652" x2="780" y2="652" stroke="#9AA0A6" stroke-width="3"/><rect x="780" y="616" width="640" height="72" rx="10" fill="#F7F7F7" stroke="#9AA0A6" stroke-width="2"/><text x="804" y="652" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" opacity="1">一致 → 重放 / 冲突 → 不命中</text><rect x="160" y="728" width="1260" height="72" rx="12" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="10 6"/><text x="184" y="764" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">降级：Redis 不可用 → 仅进程内 L0，不阻断问答</text><text x="160" y="852" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">实测 1｜意图类负样本余弦上界 0.9187，全部低于阈值 0.95。</text><text x="160" y="906" font-family="Microsoft YaHei" font-size="38" font-weight="normal" fill="#555555" text-anchor="start" dominant-baseline="central" opacity="1">实测 2｜阈值之上仅 1 例被 L2 拦截：cos 0.9673，槽位冲突 → 不命中。</text></svg>