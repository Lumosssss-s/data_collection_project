# H5 移动端预览（Taro miniapp/dist 产物）—— server block 挂载进 medical-frontend 容器
# 与 frontend/nginx.conf（PC 端 :80）并存；本文件只服务 8080 端口的移动端站点
# 行为对齐原 python 预览（scripts/h5_preview.py）：Basic Auth + SPA 回退 + /api 反代
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/h5;
    index index.html;

    # 凭据由 /docker-entrypoint.d/40-h5-htpasswd.sh 在容器启动时从环境变量生成
    auth_basic "h5-preview";
    auth_basic_user_file /etc/nginx/.htpasswd_h5;

    # 静态站点：SPA 回退（Taro hash 路由下主要防御直刷路径），禁缓存便于迭代
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 反向代理到后端（无 URI 部分的 proxy_pass 原样转发 /api/v1/...，与 python 预览一致）
    location /api/ {
        proxy_pass http://medical-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（流式问答）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
